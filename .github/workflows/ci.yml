name: CI — Build, Boot & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for CI
        run: echo "GROQ_API_KEY=dummy" > .env

      - name: Build all services
        run: docker compose build

      - name: Boot services
        run: docker compose up -d
        env:
          GROQ_API_KEY: dummy

      - name: Wait for gateway health check
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/metrics/ > /dev/null 2>&1; then
              echo "Gateway is healthy!"
              break
            fi
            echo "Attempt $i/30 — gateway not ready yet, waiting 10s..."
            sleep 10
          done
          # Final check — fail the job if still not healthy
          curl -sf http://localhost:8000/metrics/ > /dev/null || (echo "Gateway failed to start" && docker compose logs && exit 1)

      - name: Print service logs (pre-test)
        if: always()
        run: docker compose logs --tail=50

      - name: Set up Python for test runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements.test.txt

      - name: Run load test suite
        run: python load_test.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Print service logs (post-test)
        if: always()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose down
